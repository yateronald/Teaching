<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Learn French with Natives</title>

    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0e1f4d" />
    <meta name="apple-mobile-web-app-title" content="Learn French with Natives" />
    <meta name="format-detection" content="telephone=no" />

    <!--
      Fonts are served from this site (latin subset, variable weights), not
      from Google: no stylesheet to wait for on another server before the page
      can appear. Files come from Google Fonts (SIL Open Font License); when
      replacing one, change its file name too, as /fonts/ is cached for a year.
    -->
    <link rel="preload" href="/fonts/plus-jakarta-sans-latin-v12.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-latin-v20.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
        src: url(/fonts/inter-latin-v20.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Plus Jakarta Sans';
        font-style: normal;
        font-weight: 500 800;
        font-display: swap;
        src: url(/fonts/plus-jakarta-sans-latin-v12.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
    </style>

    <!--
      The public pages (home and exam/course pages, in English and French) are
      pre-rendered at build time by scripts/prerender.mjs: their title, meta
      tags, hreflang, Open Graph and JSON-LD are injected here, their full HTML
      inside #root, and the address each file was made for in data-page.
      The home page file is also served for the signed-in app; there, the
      pre-rendered page stays hidden until React takes over.
    -->
    <script>
      (function () {
        var page = document.documentElement.getAttribute('data-page');
        if (page && page !== '*' && location.pathname.replace(/\/?$/, '/') !== page) document.documentElement.classList.add('app-route');
      })();
    </script>
    <style>
      .app-route #root > .lp { display: none; }
    </style>
    <!--app-head-->
  </head>
  <body>
    <noscript>
      <p style="padding:16px;font-family:system-ui,sans-serif">
        Learn French with Natives needs JavaScript for the student space. Contact:
        <a href="mailto:support@learnfrenchwithnatives.com">support@learnfrenchwithnatives.com</a>
      </p>
    </noscript>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
