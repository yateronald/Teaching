<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Student Success Stories Video Thumbnail -->
  <!-- Background -->
  <rect width="400" height="300" fill="#f1f5f9"/>
  
  <!-- Face circle -->
  <circle cx="200" cy="120" r="60" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  
  <!-- Eyes -->
  <circle cx="185" cy="105" r="4" fill="#374151"/>
  <circle cx="215" cy="105" r="4" fill="#374151"/>
  
  <!-- Glasses -->
  <circle cx="185" cy="105" r="15" fill="none" stroke="#6b7280" stroke-width="2"/>
  <circle cx="215" cy="105" r="15" fill="none" stroke="#6b7280" stroke-width="2"/>
  <line x1="200" y1="105" x2="200" y2="105" stroke="#6b7280" stroke-width="2"/>
  
  <!-- Nose -->
  <path d="M200 115 L195 125 L205 125 Z" fill="#d97706" opacity="0.3"/>
  
  <!-- Smile -->
  <path d="M185 135 Q200 150 215 135" stroke="#374151" stroke-width="2" fill="none"/>
  
  <!-- Hair -->
  <path d="M140 75 Q200 55 260 75 Q250 95 200 85 Q150 95 140 75" fill="#4b5563"/>
  
  <!-- Text overlay -->
  <rect x="50" y="220" width="300" height="60" fill="rgba(16, 185, 129, 0.9)" rx="8"/>
  <text x="200" y="245" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Student Success Stories</text>
  <text x="200" y="265" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">Hear from our successful students</text>
  
  <!-- Play button -->
  <circle cx="200" cy="150" r="25" fill="rgba(16, 185, 129, 0.8)"/>
  <polygon points="190,140 190,160 210,150" fill="white"/>
</svg>