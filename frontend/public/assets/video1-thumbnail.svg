<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- TEF Preparation Video Thumbnail -->
  <!-- Background -->
  <rect width="400" height="300" fill="#f8fafc"/>
  
  <!-- Face circle -->
  <circle cx="200" cy="120" r="60" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  
  <!-- Eyes -->
  <circle cx="185" cy="105" r="4" fill="#374151"/>
  <circle cx="215" cy="105" r="4" fill="#374151"/>
  
  <!-- Nose -->
  <path d="M200 115 L195 125 L205 125 Z" fill="#f59e0b" opacity="0.3"/>
  
  <!-- Mouth -->
  <path d="M185 135 Q200 145 215 135" stroke="#374151" stroke-width="2" fill="none"/>
  
  <!-- Hair -->
  <path d="M140 80 Q200 60 260 80 Q250 100 200 90 Q150 100 140 80" fill="#6b7280"/>
  
  <!-- Text overlay -->
  <rect x="50" y="220" width="300" height="60" fill="rgba(34, 197, 94, 0.9)" rx="8"/>
  <text x="200" y="245" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Student Success Stories</text>
  <text x="200" y="265" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">Hear from students who achieved their goals</text>
  
  <!-- Play button -->
  <circle cx="200" cy="150" r="25" fill="rgba(37, 99, 235, 0.8)"/>
  <polygon points="190,140 190,160 210,150" fill="white"/>
</svg>